name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
        
    - name: Extract version from tag
      id: version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag -replace '^v', ''
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Extracted version: $version"
        
    - name: Update version in csproj
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $csproj = "FACTOVA_MessageLogViewer.csproj"
        $content = Get-Content $csproj -Raw
        $content = $content -replace '<Version>.*?</Version>', "<Version>$version</Version>"
        $content = $content -replace '<AssemblyVersion>.*?</AssemblyVersion>', "<AssemblyVersion>$version.0</AssemblyVersion>"
        $content = $content -replace '<FileVersion>.*?</FileVersion>', "<FileVersion>$version.0</FileVersion>"
        Set-Content $csproj $content -NoNewline
        echo "Updated version to $version"
        
    - name: Restore dependencies
      run: dotnet restore FACTOVA_MessageLogViewer.csproj
      
    - name: Build
      run: dotnet build FACTOVA_MessageLogViewer.csproj -c Release --no-restore
      
    - name: Publish
      run: dotnet publish FACTOVA_MessageLogViewer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o ./publish
      
    - name: Create zip archive
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./FACTOVA_MessageLogViewer_${{ steps.version.outputs.VERSION }}.zip
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./FACTOVA_MessageLogViewer_${{ steps.version.outputs.VERSION }}.zip
          ./publish/FACTOVA_MessageLogViewer.exe
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
